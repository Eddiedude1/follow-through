<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow Through system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }
    .note {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Follow Through</p>
    <h1>Three services, one shared database</h1>
    <p class="note">The services never call each other. The bot writes, the scheduler reads and marks reminders sent, and the backup copies the file. SQLite is the only shared state.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-title system-overview-desc">
        <title id="system-overview-title">Follow Through system architecture</title>
        <desc id="system-overview-desc">Telegram, a bot, scheduler and backup service on a Raspberry Pi sharing one SQLite database, with Claude called from the bot and backups copied to Google Drive.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: Raspberry Pi -->
        <rect x="232" y="60" width="560" height="416" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="248" y="64" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="314" y="73" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RASPBERRY PI · SYSTEMD</text>

        <!-- Arrows -->
        <!-- Telegram -> bot -->
        <line x1="168" y1="124" x2="272" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="176" y="104" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="113" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPDATES</text>
        <!-- bot -> Telegram -->
        <line x1="272" y1="156" x2="168" y2="156" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="176" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPLIES</text>
        <!-- scheduler -> Telegram -->
        <path d="M272,264 H108 Q100,264 100,256 V172" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="140" y="244" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="172" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REMINDERS</text>
        <!-- bot -> Claude -->
        <line x1="432" y1="124" x2="848" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="600" y="104" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="113" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL-USE LOOP</text>
        <!-- bot -> SQLite -->
        <path d="M432,156 H582 Q590,156 590,164 V232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="598" y="190" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
        <!-- scheduler -> SQLite -->
        <line x1="432" y1="264" x2="520" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="456" y="244" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="476" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POLLS</text>
        <!-- SQLite -> backup -->
        <path d="M590,296 V364 Q590,372 582,372 H432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="598" y="324" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="618" y="333" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>
        <!-- backup -> local backups -->
        <line x1="432" y1="404" x2="620" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="500" y="412" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="421" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COPIES</text>
        <!-- local backups -> Drive (cron + rclone, outside the app) -->
        <line x1="760" y1="404" x2="848" y2="404" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="772" y="384" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="804" y="393" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RCLONE 3AM</text>

        <!-- Nodes -->
        <!-- Telegram (external) -->
        <rect x="32" y="108" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="108" width="136" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="100" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Telegram</text>
        <text x="100" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Bot API · you</text>

        <!-- Bot service -->
        <rect x="272" y="108" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="108" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bot service</text>
        <text x="352" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bot.py · agent.py</text>

        <!-- Scheduler -->
        <rect x="272" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="232" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scheduler service</text>
        <text x="352" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scheduler.py · polling</text>

        <!-- Backup service -->
        <rect x="272" y="356" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="356" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup service</text>
        <text x="352" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">backup.py · every 24h</text>

        <!-- SQLite (focal) -->
        <rect x="520" y="232" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="232" width="140" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="590" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQLite</text>
        <text x="590" y="267" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">notes · commitments</text>
        <text x="590" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reminders · feedback</text>

        <!-- Local backups (store) -->
        <rect x="620" y="372" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="372" width="140" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="690" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Local backups</text>
        <text x="690" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SD card folder</text>

        <!-- Anthropic API (external) -->
        <rect x="848" y="92" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="92" width="120" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="908" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Anthropic API</text>
        <text x="908" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Claude · tool use</text>

        <!-- Google Drive (external) -->
        <rect x="848" y="372" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="372" width="120" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="908" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Google Drive</text>
        <text x="908" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rclone remote</text>

        <!-- Legend -->
        <line x1="30" y1="500" x2="970" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="96" y="519" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Service</text>
        <rect x="200" y="519" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="224" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Shared state</text>
        <rect x="332" y="519" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="356" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">External</text>
        <rect x="440" y="519" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="464" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Local store</text>
        <line x1="568" y1="524" x2="592" y2="524" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="600" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Internal</text>
        <line x1="680" y1="524" x2="704" y2="524" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="712" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">API / network</text>
        <line x1="824" y1="524" x2="848" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="856" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Outside the app</text>
      </svg>
    </div>
  </div>
</body>
</html>
