[project]
name = "follow-through"
version = "0.1.0"
description = "A personal agent that catches the small things my wife mentions and makes sure I follow through."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "python-telegram-bot",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["follow_through", "eval"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
